[project]
name = "squipi-worker"
version = "0.1.0"
description = "Squipi's local analysis worker: deterministic data tools behind private stdio IPC."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15,<22",
  "openpyxl>=3.1,<4",
  "scipy>=1.13,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.scripts]
squipi-worker = "squipi_worker.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["squipi_worker*"]

[tool.setuptools.package-data]
squipi_worker = ["research_skills.json", "survey_adapter.R"]

[tool.pytest.ini_options]
timeout = 120
